name: abcrown
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # PyTorch (CPU build — cu130 build also works but requires CUDA 13.0 driver)
    - torch==2.11.0
    - torchvision>=0.21.0
    # α,β-Crown core dependencies
    - onnx>=1.20.0
    - onnxoptimizer>=0.4.2
    - onnxruntime>=1.24.0
    - onnxscript>=0.7.0
    - onnxsim>=0.4.36
    - pyyaml>=6.0
    - scipy>=1.9.0
    - numpy>=2.0.0
    - pandas>=2.0.0
    - matplotlib>=3.6.0
    - tqdm>=4.64.0
    - sortedcontainers>=2.4.0
    - termcolor>=2.0.0
    - psutil>=5.9.0
    - sympy>=1.12.0
    - pillow>=10.0.0
    - appdirs>=1.4.4
    - graphviz>=0.20.0
    - "gurobipy<13.0.0"
    # α,β-Crown custom ONNX converter (from Verified-Intelligence fork)
    - "onnx2pytorch @ git+https://github.com/Verified-Intelligence/onnx2pytorch@0826948e0d50cd09d909b7f26b2ee9ca2d3d71b3"
    # α,β-Crown auto_LiRPA (install from cloned repo):
    #   cd alpha-beta-CROWN && pip install -e auto_LiRPA
