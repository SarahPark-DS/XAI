# α,β-Crown configuration for EMNIST Letters FC network verification
# Model: 784->256->128->26 fully connected (same as Assignment 3 Marabou experiment)
# Dataset: EMNIST Letters (a-z, 26 classes)
# Property: L∞ robustness with epsilon=0.01

general:
  device: cpu           # CPU mode (torch cu130 build incompatible with driver 12.2)
  seed: 42
  # root_path and csv_name are set via CLI: --root_path and --csv_name
  # or managed by test.py subprocess calls

model:
  onnx_path: models/emnist_fc.onnx

specification:
  type: vnnlib          # Use VNNlib spec files generated by generate_specs.py

solver:
  batch_size: 512       # Large batch for CPU (no VRAM limit)
  alpha-crown:
    iteration: 100      # Alpha optimization steps
    lr_alpha: 0.1
  beta-crown:
    lr_alpha: 0.01
    lr_beta: 0.05
    iteration: 20
  bound_prop_method: crown

bab:
  timeout: 30           # 30s per instance (generous for 784->256->128->26)
  max_domains: 200000
  branching:
    method: kfsb        # Best branching for FC networks
    candidates: 3
    reduceop: min

attack:
  pgd_order: before     # Run PGD attack before verification (quickly finds SAT cases)
  pgd_steps: 100
  pgd_restarts: 5
